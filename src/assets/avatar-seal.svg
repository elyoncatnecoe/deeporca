<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Seal-GPT：圆润小海豹。和 3D 里那只同源（灰蓝身体 + 浅色肚皮 + 斑点 + 胡须） -->
  <ellipse cx="64" cy="74" rx="44" ry="42" fill="#8CB4D4"/>
  <!-- 肚皮 -->
  <ellipse cx="64" cy="86" rx="28" ry="26" fill="#E8F0F8"/>
  <!-- 左右前鳍 -->
  <ellipse cx="22" cy="88" rx="12" ry="18" transform="rotate(18 22 88)" fill="#7EA6C6"/>
  <ellipse cx="106" cy="88" rx="12" ry="18" transform="rotate(-18 106 88)" fill="#7EA6C6"/>
  <!-- 头上的斑点（呼应背上的 OpenAI 纹样） -->
  <circle cx="92" cy="52" r="5" fill="#7EA6C6" opacity="0.85"/>
  <circle cx="102" cy="66" r="3.4" fill="#7EA6C6" opacity="0.75"/>
  <circle cx="80" cy="42" r="2.8" fill="#7EA6C6" opacity="0.65"/>
  <!-- 鼻子与嘴 -->
  <ellipse cx="64" cy="60" rx="7" ry="5" fill="#3A2A2A"/>
  <path d="M64 64 q-7 8 -14 5 M64 64 q7 8 14 5" fill="none" stroke="#3A2A2A" stroke-width="2.6" stroke-linecap="round"/>
  <!-- 眼睛 + 高光 -->
  <circle cx="46" cy="52" r="5.5" fill="#111122"/>
  <circle cx="82" cy="52" r="5.5" fill="#111122"/>
  <circle cx="47.8" cy="50" r="1.9" fill="#FFFFFF"/>
  <circle cx="83.8" cy="50" r="1.9" fill="#FFFFFF"/>
  <!-- 腮红 -->
  <ellipse cx="36" cy="66" rx="6" ry="3.6" fill="#FFAACC" opacity="0.75"/>
  <ellipse cx="92" cy="66" rx="6" ry="3.6" fill="#FFAACC" opacity="0.75"/>
  <!-- 胡须 -->
  <path d="M26 62 l-12 -3 M26 68 l-12 3 M102 62 l12 -3 M102 68 l12 3" stroke="#DDDDDD" stroke-width="1.8" stroke-linecap="round"/>
</svg>
