<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Clawd：方块小螃蟹。几何化造型，和 3D 里那只同源（橙色方块身体 + 方耳朵 + 四腿 + 两只眼） -->
  <rect x="18" y="46" width="92" height="52" rx="6" fill="#DC7759"/>
  <rect x="18" y="46" width="92" height="14" rx="6" fill="#E88B6E"/>
  <!-- 侧面方耳朵 -->
  <rect x="6" y="52" width="14" height="40" rx="4" fill="#DC7759"/>
  <rect x="108" y="52" width="14" height="40" rx="4" fill="#DC7759"/>
  <!-- 四只腿 -->
  <rect x="30" y="96" width="12" height="16" rx="3" fill="#C4664A"/>
  <rect x="50" y="96" width="12" height="16" rx="3" fill="#C4664A"/>
  <rect x="66" y="96" width="12" height="16" rx="3" fill="#C4664A"/>
  <rect x="86" y="96" width="12" height="16" rx="3" fill="#C4664A"/>
  <!-- 眼睛 -->
  <rect x="44" y="66" width="7" height="18" rx="3.5" fill="#3D2B25"/>
  <rect x="77" y="66" width="7" height="18" rx="3.5" fill="#3D2B25"/>
  <!-- 嘴 -->
  <path d="M58 86 q6 6 12 0" fill="none" stroke="#3D2B25" stroke-width="3" stroke-linecap="round"/>
</svg>
